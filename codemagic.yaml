workflows:
  ios-testflight:
    name: Travyon iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    # Create this integration in Codemagic with the exact same name.
    integrations:
      app_store_connect: travyon_app_store

    environment:
      groups:
        # Add GOOGLE_MAPS_IOS_API_KEY to this Codemagic variable group.
        - travyon_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.travyon.app
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $HOME/.pub-cache

    scripts:
      - name: Install Flutter packages
        script: flutter pub get

      - name: Configure iOS signing
        script: xcode-project use-profiles

      - name: Analyze Flutter code
        script: flutter analyze --no-pub

      - name: Run Flutter tests
        script: flutter test --no-pub

      - name: Build signed IPA
        script: >-
          flutter build ipa --release
          --build-number="$PROJECT_BUILD_NUMBER"
          --export-options-plist=/Users/builder/export_options.plist
          --dart-define=TRAVYON_FIREBASE_MODE=production
          --dart-define=TRAVYON_PUSH_ENABLED=true
          --dart-define=GOOGLE_MAPS_IOS_API_KEY="$GOOGLE_MAPS_IOS_API_KEY"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    # Uploads the signed build to App Store Connect. Add yourself as an
    # internal tester from App Store Connect after Apple finishes processing it.
    publishing:
      app_store_connect:
        auth: integration
